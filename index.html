<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Como Vai a Tua Fé?</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f1e8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 35px 25px;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .description {
            font-size: 16px;
            margin-bottom: 30px;
            color: #666;
        }

        .social {
            display: block;
            width: 100%;
            padding: 17px;
            margin: 15px 0;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
            background: #555;
        }

        .social:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">✝️</div>

        <h1>COMO VAI A TUA FÉ?</h1>

        <p class="description">
            Uma mensagem de fé para transformar vidas.
        </p>

        <a class="social" href="#">
            🔵 FACEBOOK — EM BREVE
        </a>

        <a class="social" href="#">
            📸 INSTAGRAM — EM BREVE
        </a>

        <a class="social" href="#">
            🎵 TIKTOK — EM BREVE
        </a>

        <p class="footer">
            © Como Vai a Tua Fé?
        </p>

    </div>

</body>
</html>
