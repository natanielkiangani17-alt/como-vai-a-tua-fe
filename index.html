<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Como Vai a Tua Fé?</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f1e8;
            color: #222;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 30px 22px;
        }

        /* LOGO */
        .logo {
            width: 190px;
            max-width: 80%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        .description {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 28px;
            color: #666;
        }

        /* BOTÕES DAS REDES SOCIAIS */
        .social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            width: 100%;
            padding: 16px 20px;
            margin: 14px 0;

            border-radius: 12px;

            text-decoration: none;
            color: white;

            font-size: 16px;
            font-weight: bold;

            transition: transform 0.2s ease,
                        opacity 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .social:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .social:active {
            transform: scale(0.98);
        }

        .icon {
            width: 27px;
            height: 27px;
            flex-shrink: 0;
        }

        /* FACEBOOK */
        .facebook {
            background: #1877F2;
            box-shadow: 0 5px 15px rgba(24, 119, 242, 0.20);
        }

        /* INSTAGRAM */
        .instagram {
            background: linear-gradient(
                45deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );

            box-shadow: 0 5px 15px rgba(214, 41, 118, 0.20);
        }

        /* TIKTOK */
        .tiktok {
            background: #111111;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.20);
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #999;
        }

        /* MELHOR VISUALIZAÇÃO NO TELEMÓVEL */
        @media (max-width: 480px) {

            .container {
                padding: 25px 15px;
            }

            .logo {
                width: 170px;
            }

            .description {
                font-size: 15px;
            }

            .social {
                padding: 15px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGO -->
        <img
            src="logo.png"
            alt="Como Vai a Tua Fé?"
            class="logo"
        >

        <!-- DESCRIÇÃO -->
        <p class="description">
            Uma mensagem de fé para transformar vidas.
        </p>


        <!-- FACEBOOK -->
        <a
            class="social facebook"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="white"
                aria-hidden="true"
            >
                <path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.019 4.388 11.004 10.125 11.927v-8.432H7.078v-3.495h3.047V9.413c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.235 2.686.235v2.953h-1.514c-1.491 0-1.956.93-1.956 1.885v2.284h3.328l-.532 3.495h-2.796V24C19.612 23.077 24 18.092 24 12.073z"/>
            </svg>

            FACEBOOK

        </a>


        <!-- INSTAGRAM -->
        <a
            class="social instagram"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="white"
                aria-hidden="true"
            >
                <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0-6 0zm5.25-3.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>
            </svg>

            INSTAGRAM

        </a>


        <!-- TIKTOK -->
        <a
            class="social tiktok"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >

            <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="white"
                aria-hidden="true"
            >
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.26V2h-3.45v13.67a2.9 2.9 0 1 1-2.9-2.9c.3 0 .59.05.86.13V9.4a6.33 6.33 0 1 0 5.49 6.27V8.75a8.27 8.27 0 0 0 4.84 1.56V6.88a4.84 4.84 0 0 1-1.07-.19z"/>
            </svg>

            TIKTOK

        </a>


        <!-- RODAPÉ -->
        <p class="footer">
            © Como Vai a Tua Fé?
        </p>

    </div>

</body>
</html>
